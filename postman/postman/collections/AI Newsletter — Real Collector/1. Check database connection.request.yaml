$kind: http-request
url: "{{base_url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Database connected", () => pm.expect(pm.response.json().ok).to.eql(true));
    language: text/javascript
order: 1000
