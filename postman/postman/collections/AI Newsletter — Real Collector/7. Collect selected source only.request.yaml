$kind: http-request
name: 7. Collect selected source only
url: "{{base_url}}/collector/run?source_id=5"
method: POST
queryParams:
  - key: source_id
    value: "5"
    disabled: false
    description: ""
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("Collection has no failures", () => { const r = pm.response.json(); pm.expect(r).not.to.have.property("skipped"); pm.expect(r.failures).to.eql(0); });
    language: text/javascript
order: 7000
